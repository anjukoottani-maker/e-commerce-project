<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Registration</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}

header{
    background:#222;
    color:white;
    padding:15px 30px;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

nav ul{
    list-style:none;
    display:flex;
}

nav ul li{
    margin-left:20px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

.hero{
    text-align:center;
    padding:60px 20px;
}

.hero h1{
    margin-bottom:10px;
}

.hero p{
    margin-bottom:20px;
}

.container{
    max-width:400px;
    margin:auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.container input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

.container button{
    width:100%;
    padding:12px;
    background:#222;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.container button:hover{
    background:#444;
}

#message{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.login-link{
    margin-top:15px;
    text-align:center;
}

footer{
    background:#222;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}
</style>
</head>

<body>

<header>
    <nav>
        <div class="logo">E-Commerce Store</div>

        <ul>
            <li><a href="home.html">Home</a></li>
            <li><a href="register.html">Register</a></li>
            <li><a href="login.html">Login</a></li>
             <li><a href="products.html">Products</a></li>
            <li><a href="cart.html">Cart</a></li>
            <li><a href="orders.html">Orders</a></li>
             <li><a href="checkout.html">Checkout</a></li>
            <li><a href="home.html#contact">Contact</a></li>
        </ul>
    </nav>
</header>

<section class="hero">

    <h1>User Registration</h1>
    <p>Create your account to start shopping.</p>

    <div class="container">

        <form id="registerForm">

            <input
                type="text"
                id="name"
                placeholder="Enter Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Enter Email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <div id="message"></div>

        <div class="login-link">
            Already have an account?
            <a href="login.html">Login</a>
        </div>

    </div>

</section>

<footer>
    <p>© 2026 E-Commerce Store. All Rights Reserved.</p>
</footer>

<script>

document
.getElementById("registerForm")
.addEventListener("submit", function(event){

    event.preventDefault();

    const name =
        document.getElementById("name").value;

    const email =
        document.getElementById("email").value;

    const password =
        document.getElementById("password").value;

    fetch("/register", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({

            name: name,
            email: email,
            password: password

        })

    })

    .then(response => response.text())

    .then(data => {

        document.getElementById("message")
        .innerText = data;

        if(data === "Registration Successful"){

            document.getElementById("registerForm")
            .reset();

            setTimeout(() => {

                window.location.href =
                "login.html";

            }, 1000);

        }

    })

    .catch(error => {

        console.error(error);

        document.getElementById("message")
        .innerText = "Registration Failed";

    });

});

</script>

</body>
</html>
