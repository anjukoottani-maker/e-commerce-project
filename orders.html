<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Order History</title>


<style>

/* =========================
   GENERAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}


/* =========================
   HEADER
========================= */

header{
    background:#222;
    color:white;
    padding:15px 30px;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

nav ul{
    list-style:none;
    display:flex;
    flex-wrap:wrap;
}

nav ul li{
    margin-left:20px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

nav ul li a:hover{
    text-decoration:underline;
}


/* =========================
   HERO
========================= */

.hero{
    background:white;
    text-align:center;
    padding:50px 20px;
}

.hero h1{
    font-size:36px;
    margin-bottom:10px;
}

.hero p{
    color:#555;
    font-size:18px;
}


/* =========================
   ORDERS CONTAINER
========================= */

.orders-container{

    max-width:1000px;

    margin:40px auto;

    background:white;

    padding:30px;

    border-radius:10px;

    box-shadow:0 0 10px rgba(0,0,0,0.1);

}


/* =========================
   ORDER CARD
========================= */

.order-card{

    border:1px solid #ddd;

    border-radius:8px;

    padding:20px;

    margin-bottom:20px;

    background:#fafafa;

}


.order-card h3{

    margin-bottom:15px;

    color:#222;

}


.order-card p{

    margin:8px 0;

    color:#555;

}


.order-total{

    font-size:20px;

    font-weight:bold;

    margin-top:15px;

    color:#222;

}


/* =========================
   EMPTY ORDERS
========================= */

.empty-orders{

    text-align:center;

    padding:40px;

}


.empty-orders h2{

    margin-bottom:15px;

}


.empty-orders p{

    color:#666;

    margin-bottom:20px;

}


/* =========================
   BUTTONS
========================= */

.button-section{

    display:flex;

    justify-content:center;

    gap:15px;

    margin-top:30px;

    flex-wrap:wrap;

}


.button{

    display:inline-block;

    background:#222;

    color:white;

    text-decoration:none;

    padding:12px 20px;

    border:none;

    border-radius:5px;

    cursor:pointer;

}


.button:hover{

    background:#444;

}


/* =========================
   MESSAGE
========================= */

#message{

    text-align:center;

    padding:30px;

    color:#555;

    font-size:18px;

}


/* =========================
   FOOTER
========================= */

footer{

    background:#222;

    color:white;

    text-align:center;

    padding:20px;

    margin-top:40px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    nav{

        flex-direction:column;

        gap:15px;

    }

    nav ul{

        justify-content:center;

    }

    nav ul li{

        margin:5px 10px;

    }

    .orders-container{

        margin:20px;

        padding:20px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <nav>

        <div class="logo">
            E-Commerce Store
        </div>


        <ul>

            <li>
                <a href="home.html">
                    Home
                </a>
            </li>
            <li>
                <a href="register.html">
                    Register
                </a>
            </li>

            <li>
                <a href="login.html">
                    Login
                </a>
            </li>
              <li>
                <a href="products.html">
                    Products
                </a>
            </li>
            <li>
                <a href="cart.html">
                    Cart
                </a>
            </li>
            <li>
                <a href="orders.html">
                    Orders
                </a>

            </li>
            <li>
                <a href="checkout.html">
                    Checkout
                </a>
            <li>
                <a href="home.html#contact">
                    Contact
                </a>
            </li>

        </ul>

    </nav>

</header>



<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h1>
        📦 Order History
    </h1>

    <p>
        View your previous orders and purchase details.
    </p>

</section>



<!-- =========================
     ORDERS
========================= -->

<div class="orders-container">

    <div id="message">
        Loading orders...
    </div>

    <div id="ordersList"></div>


    <div class="button-section">

        <a
            href="products.html"
            class="button"
        >
            Continue Shopping
        </a>


        <a
            href="home.html"
            class="button"
        >
            Back to Home
        </a>

    </div>

</div>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        © 2026 E-Commerce Store. All Rights Reserved.
    </p>

</footer>



<script>


/* =========================
   LOAD ORDERS
========================= */

function loadOrders(){

    fetch("/api/orders")

    .then(response => {

        if(!response.ok){

            throw new Error(
                "Failed to load orders"
            );

        }

        return response.json();

    })

    .then(orders => {

        console.log(
            "Orders:",
            orders
        );


        const message =
            document.getElementById(
                "message"
            );


        const ordersList =
            document.getElementById(
                "ordersList"
            );


        message.innerText = "";


        /* =========================
           NO ORDERS
        ========================= */

        if(orders.length === 0){

            ordersList.innerHTML = `

                <div class="empty-orders">

                    <h2>
                        No Orders Found
                    </h2>

                    <p>
                        You have not placed any orders yet.
                    </p>

                    <a
                        href="products.html"
                        class="button"
                    >
                        Start Shopping
                    </a>

                </div>

            `;

            return;

        }


        /* =========================
           DISPLAY ORDERS
        ========================= */

        ordersList.innerHTML = "";


        orders.forEach(order => {


            const orderCard =
                document.createElement(
                    "div"
                );


            orderCard.className =
                "order-card";


            orderCard.innerHTML = `

                <h3>
                    Order #${order.id}
                </h3>

                <p>
                    <strong>
                        User ID:
                    </strong>
                    ${order.user_id}
                </p>

                <p>
                    <strong>
                        Product:
                    </strong>
                    ${order.product_name}
                </p>

                <p>
                    <strong>
                        Quantity:
                    </strong>
                    ${order.quantity}
                </p>

                <div class="order-total">
                    Total:
                    ₹${Number(order.total).toFixed(2)}
                </div>

            `;


            ordersList.appendChild(
                orderCard
            );

        });

    })

    .catch(error => {

        console.error(
            "Order Error:",
            error
        );


        document.getElementById(
            "message"
        ).innerText =
            "Failed to load orders.";

    });

}



/* =========================
   LOAD WHEN PAGE OPENS
========================= */

loadOrders();


</script>


</body>

</html>
