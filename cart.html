<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Shopping Cart</title>


<style>

/* =========================
   GENERAL
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f4f4;
}


/* =========================
   HEADER
========================= */

header{
    background:#222;
    color:white;
    padding:15px 30px;
}

nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

nav ul{
    list-style:none;
    display:flex;
    flex-wrap:wrap;
}

nav ul li{
    margin-left:20px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

nav ul li a:hover{
    text-decoration:underline;
}


/* =========================
   HERO
========================= */

.hero{
    background:white;
    text-align:center;
    padding:50px 20px;
}

.hero h1{
    font-size:36px;
    margin-bottom:10px;
}

.hero p{
    color:#555;
    font-size:18px;
}


/* =========================
   CART CONTAINER
========================= */

.cart-container{

    max-width:900px;

    margin:40px auto;

    background:white;

    padding:30px;

    border-radius:10px;

    box-shadow:0 0 10px rgba(0,0,0,0.1);

}


/* =========================
   CART ITEM
========================= */

.cart-item{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:20px 0;

    border-bottom:1px solid #ddd;

}


.item-details h3{

    margin-bottom:8px;

    font-size:20px;
}


.item-details p{

    color:#555;

    margin-bottom:5px;
}


.item-price{

    font-weight:bold;

    font-size:18px;
}


/* =========================
   REMOVE BUTTON
========================= */

.remove-button{

    background:#d9534f;

    color:white;

    border:none;

    padding:10px 15px;

    border-radius:5px;

    cursor:pointer;

}

.remove-button:hover{

    background:#c9302c;

}


/* =========================
   TOTAL
========================= */

.total-section{

    text-align:right;

    margin-top:30px;

    font-size:24px;

    font-weight:bold;
}


/* =========================
   BUTTONS
========================= */

.button-section{

    display:flex;

    justify-content:flex-end;

    gap:10px;

    margin-top:20px;

    flex-wrap:wrap;
}


.clear-button{

    background:#777;

    color:white;

    border:none;

    padding:12px 20px;

    border-radius:5px;

    cursor:pointer;
}


.clear-button:hover{

    background:#555;

}


.checkout-button{

    background:#222;

    color:white;

    border:none;

    padding:12px 20px;

    border-radius:5px;

    cursor:pointer;

}


.checkout-button:hover{

    background:#444;

}


/* =========================
   EMPTY CART
========================= */

.empty-cart{

    text-align:center;

    padding:40px;

}


.empty-cart h2{

    margin-bottom:15px;

}


.empty-cart p{

    color:#666;

    margin-bottom:20px;

}


.shop-button{

    display:inline-block;

    background:#222;

    color:white;

    text-decoration:none;

    padding:12px 20px;

    border-radius:5px;

}


.shop-button:hover{

    background:#444;

}


/* =========================
   FOOTER
========================= */

footer{

    background:#222;

    color:white;

    text-align:center;

    padding:20px;

    margin-top:40px;

}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    nav{

        flex-direction:column;

        gap:15px;

    }

    nav ul{

        justify-content:center;

    }

    nav ul li{

        margin:5px 10px;

    }


    .cart-item{

        flex-direction:column;

        align-items:flex-start;

        gap:15px;

    }


    .button-section{

        justify-content:center;

    }


    .total-section{

        text-align:center;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <nav>

        <div class="logo">
            E-Commerce Store
        </div>


        <ul>

            <li>
                <a href="home.html">
                    Home
                </a>
            </li>        

            <li>
                <a href="register.html">
                    Register
                </a>
            </li>

            <li>
                <a href="login.html">
                    Login
                </a>
            </li>
             <li>
                <a href="products.html">
                    Products
                </a>
            </li>

            <li>
                <a href="cart.html">
                    Cart
                </a>
            </li>
            <li>
                <a href="orders.html">
                    Orders
                </a>
            </li>
             <li>
                <a href="checkout.html">
                    Checkout
                </a>
            </li>

            <li>
                <a href="home.html#contact">
                    Contact
                </a>
            </li>

        </ul>

    </nav>

</header>



<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h1>
        🛒 Shopping Cart
    </h1>

    <p>
        Review your selected products before checkout.
    </p>

</section>



<!-- =========================
     CART
========================= -->

<div class="cart-container"
     id="cartContainer">

</div>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        © 2026 E-Commerce Store. All Rights Reserved.
    </p>

</footer>



<script>


/* =========================
   DISPLAY CART
========================= */

function displayCart(){

    let cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    const container =
        document.getElementById(
            "cartContainer"
        );


    /* =========================
       EMPTY CART
    ========================= */

    if(cart.length === 0){

        container.innerHTML = `

            <div class="empty-cart">

                <h2>
                    Your Cart is Empty
                </h2>

                <p>
                    You have not added any products yet.
                </p>

                <a
                    href="products.html"
                    class="shop-button"
                >
                    Continue Shopping
                </a>

            </div>

        `;

        return;

    }


    /* =========================
       CART ITEMS
    ========================= */

    let total = 0;


    let html = "";


    cart.forEach(
        (product, index) => {


        const price =
            Number(product.price);


        total += price;


        html += `

            <div class="cart-item">

                <div class="item-details">

                    <h3>
                        ${product.product_name}
                    </h3>

                    <p>
                        ${product.description || ""}
                    </p>

                    <div class="item-price">
                        ₹${price.toFixed(2)}
                    </div>

                </div>


                <button
                    class="remove-button"
                    onclick="removeItem(${index})"
                >
                    Remove
                </button>

            </div>

        `;

    });


    /* =========================
       TOTAL + BUTTONS
    ========================= */

    html += `

        <div class="total-section">

            Total:
            ₹${total.toFixed(2)}

        </div>


        <div class="button-section">

            <button
                class="clear-button"
                onclick="clearCart()"
            >
                Clear Cart
            </button>


            <button
                class="checkout-button"
                onclick="goToCheckout()"
            >
                Proceed to Checkout
            </button>

        </div>

    `;


    container.innerHTML = html;

}



/* =========================
   REMOVE ITEM
========================= */

function removeItem(index){

    let cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    cart.splice(index, 1);


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    displayCart();

}



/* =========================
   CLEAR CART
========================= */

function clearCart(){

    if(
        confirm(
            "Are you sure you want to clear the cart?"
        )
    ){

        localStorage.removeItem("cart");

        displayCart();

    }

}



/* =========================
   CHECKOUT
========================= */

function goToCheckout(){

    let cart =
        JSON.parse(
            localStorage.getItem("cart")
        ) || [];


    if(cart.length === 0){

        alert(
            "Your cart is empty."
        );

        return;

    }


    window.location.href =
        "checkout.html";

}



/* =========================
   INITIAL LOAD
========================= */

displayCart();


</script>


</body>
</html>
